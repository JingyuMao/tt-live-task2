<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>识别引擎自检</title><style>body{font:16px/1.7 system-ui;background:#111512;color:#d4f88c;padding:32px}button{padding:15px}pre{white-space:pre-wrap}</style><h1>识别引擎自检</h1><p>使用空白测试图验证真实模型下载、后台初始化和推理；不调用摄像头，也不验证表情准确率。</p><button id="run">运行自检</button><pre id="result" role="status">等待运行</pre><a href="./" style="color:white">返回原型</a><script>
document.getElementById('run').onclick=()=>{const b=document.getElementById('run'),r=document.getElementById('result');b.disabled=true;r.textContent='加载真实模型中…';const w=new Worker('./tracker-worker.js'),timeout=setTimeout(()=>finish('FAIL: 超时'),60000);function finish(s){clearTimeout(timeout);r.textContent=s;b.disabled=false;w.terminate();}w.onerror=e=>finish('FAIL: '+e.message);w.onmessage=async({data})=>{if(data.type==='error')finish('FAIL: '+data.message);if(data.type==='ready'){r.textContent='模型初始化成功，执行空白图推理…';const c=document.createElement('canvas');c.width=480;c.height=360;const bitmap=await createImageBitmap(c);w.postMessage({type:'frame',bitmap,timestamp:performance.now()},[bitmap]);}if(data.type==='result')finish('PASS: 模型加载、Worker、WASM 与真实推理正常。\n空白图人脸数：'+(data.landmarks?1:0)+'\n推理耗时：'+Math.round(data.ms)+' ms\n这不是摄像头／真人表情准确率测试。');};w.postMessage({type:'init'});};
</script></html>
